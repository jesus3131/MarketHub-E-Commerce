<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /var/log/httpd/ecommerce-error.log
    CustomLog /var/log/httpd/ecommerce-combined.log combined

    ProxyPreserveHost On
    ProxyRequests Off

    # Auth Service (port 3001)
    ProxyPass /auth http://localhost:3001/auth
    ProxyPassReverse /auth http://localhost:3001/auth

    # Product Service (port 3002)
    ProxyPass /products http://localhost:3002/products
    ProxyPassReverse /products http://localhost:3002/products
    ProxyPass /categories http://localhost:3002/categories
    ProxyPassReverse /categories http://localhost:3002/categories
    ProxyPass /cart http://localhost:3002/cart
    ProxyPassReverse /cart http://localhost:3002/cart
    ProxyPass /activities http://localhost:3002/activities
    ProxyPassReverse /activities http://localhost:3002/activities
    ProxyPass /notifications http://localhost:3002/notifications
    ProxyPassReverse /notifications http://localhost:3002/notifications
    ProxyPass /inventory http://localhost:3002/inventory
    ProxyPassReverse /inventory http://localhost:3002/inventory
    ProxyPass /alerts http://localhost:3002/alerts
    ProxyPassReverse /alerts http://localhost:3002/alerts
    ProxyPass /promotions http://localhost:3002/promotions
    ProxyPassReverse /promotions http://localhost:3002/promotions

    # Order Service (port 3003)
    ProxyPass /orders http://localhost:3003/orders
    ProxyPassReverse /orders http://localhost:3003/orders

    # Report Service (port 3004)
    ProxyPass /api http://localhost:3004/api
    ProxyPassReverse /api http://localhost:3004/api
    ProxyPass /reports http://localhost:3004/reports
    ProxyPassReverse /reports http://localhost:3004/reports
    ProxyPass /ws ws://localhost:3004
    ProxyPassReverse /ws ws://localhost:3004

    # Carousel Service (port 3005)
    ProxyPass /carousel http://localhost:3005/carousel
    ProxyPassReverse /carousel http://localhost:3005/carousel
    ProxyPass /uploads http://localhost:3005/uploads
    ProxyPassReverse /uploads http://localhost:3005/uploads
</VirtualHost>
